name: Destroy dev

# Called by dev-cleanup.yml. Deletes every stack in the agent account tagged
# with this repo's project, stage=dev and the pull request's branch, through
# the default bootstrap's CDK execution role, so buckets the stacks empty on
# delete are emptied. It runs no code from the repo.
#
# It takes no inputs. The caller is the pull request's own copy of
# dev-cleanup.yml, so the branch comes from the pull_request event itself,
# and a pull request can only delete its own branch's dev stacks.
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_CLEANUP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Delete the branch's dev stacks
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          QUALIFIER: hnb659fds
          PROJECT: ${{ github.event.repository.name }}
        run: |
          if [ -z "$BRANCH" ]; then
            echo "No pull request branch in the event." >&2
            exit 1
          fi
          # The same slug as devSlug in lib/stage.ts, which tags dev stacks with it.
          readable="$(printf '%s' "$BRANCH" | LC_ALL=C sed -E 's/[^A-Za-z0-9]+/-/g; s/^-+|-+$//g' | LC_ALL=C cut -c1-50 | sed -E 's/-+$//')"
          hash="$(printf '%s' "$BRANCH" | sha256sum | cut -c1-8)"
          slug="${readable:+${readable}-}${hash}"
          account="$(aws sts get-caller-identity --query Account --output text)"
          exec_role="arn:aws:iam::${account}:role/cdk-${QUALIFIER}-cfn-exec-role-${account}-${AWS_REGION}"
          stacks="$(aws cloudformation describe-stacks --output text --query \
            "Stacks[?Tags[?Key=='project' && Value=='${PROJECT}'] && Tags[?Key=='stage' && Value=='dev'] && Tags[?Key=='branch' && Value=='${slug}']].StackName")"
          if [ -z "$stacks" ]; then
            echo "No dev stacks for branch ${BRANCH}."
            exit 0
          fi
          for stack in $stacks; do
            echo "Deleting ${stack}"
            aws cloudformation delete-stack --stack-name "$stack" --role-arn "$exec_role"
          done
          for stack in $stacks; do
            aws cloudformation wait stack-delete-complete --stack-name "$stack"
            echo "Deleted ${stack}"
          done
