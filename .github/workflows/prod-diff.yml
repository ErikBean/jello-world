name: Production diff

# Shows how a pull request changes production, by comparing its prod stage
# with the templates the last production deploy saved. It runs the pull
# request's own code, so it gets no AWS credentials.
on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  prod-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx cdk synth --quiet -c stage=prod -o cdk.out.prod
      - name: Download the last production templates
        env:
          GH_TOKEN: ${{ github.token }}
        # Only two cases count as nothing to compare with: deploy.yml isn't on
        # main yet, so the first merge hasn't deployed, or the last deploy's
        # templates have expired. Any other error fails the step, so the diff
        # never passes on a deploy it couldn't read.
        run: |
          set -euo pipefail
          if ! run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>err.txt)"; then
            cat err.txt >&2
            if grep -q 'HTTP 404: workflow deploy.yml not found on the default branch' err.txt; then
              echo "deploy.yml isn't on main yet, so nothing is deployed." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          if [ -z "$run_id" ]; then
            echo "deploy.yml has no successful run on main yet, so nothing is deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          expired="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            -q '[.artifacts[] | select(.name == "prod-templates")][0] | if . == null then "missing" else (.expired | tostring) end')"
          case "$expired" in
            false) gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n prod-templates -D prod-before ;;
            true) echo "The templates from the last deploy, run $run_id, have expired." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) echo "Deploy run $run_id saved no prod-templates artifact." >&2; exit 1 ;;
          esac
      - run: node scripts/diff-prod.mjs prod-before cdk.out.prod | tee -a "$GITHUB_STEP_SUMMARY"
