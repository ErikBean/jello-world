name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: ErikBean/factory/.github/workflows/app-ci.yml@v0.2.0
  prod-diff:
    permissions:
      contents: read
      actions: read
    uses: ErikBean/factory/.github/workflows/app-prod-diff.yml@v0.2.0

  # Warns, without failing, when the factory skills pinned in .agents/ are
  # behind factory-skills.
  factory-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-factory-skills.mjs
