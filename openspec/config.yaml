schema: spec-driven

context: |
  Merging to main deploys to production through `.github/workflows/deploy.yml`, which calls the factory's reusable workflows at a release tag. The app is a `FactoryStack` from `@favabean/factory-cdk`, which sets the stage (`-c stage=dev|prod`; `dev` per branch), stack names, the `project`, `stage` and `branch` tags the dev cleanup finds stacks by, the `ci` bootstrap for prod, and the `agent-boundary` permissions boundary on every IAM role, failing synth for any role without it. Every new stack must be a `FactoryStack`. The account-level requirements are the factory's specs, named in `factory.config.yaml`; while every stage shares one account, there are no per-pull-request previews. Nothing in `prod` may depend on a resource in another stage. Every change must leave `npm test`, `npx cdk synth -c stage=prod` and `npx factory-check-boundaries cdk.out` passing. `FactoryStack` deletes `dev` data with its stacks, but buckets need it on their own props: `removalPolicy: stack.stage.ephemeral ? RemovalPolicy.DESTROY : RemovalPolicy.RETAIN` and `autoDeleteObjects: stack.stage.ephemeral`. For `prod`, decide for each bucket or table whether its data must outlive the stack. Each stack that serves something outputs its URL with `stack.addUrl(...)`, so the smoke test finds it. The account's organization policies may deny some Regions, services or resource types outright, such as EC2 instances, NAT gateways or load balancers, so check what the account allows before designing around a service.

